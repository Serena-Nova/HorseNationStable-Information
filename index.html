<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Horse Nation Stalmanagement</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐴</text></svg>">
<style>
:root {
  --bg: #f7f4ef;
  --bg-panel: #ffffff;
  --bg-panel-2: #efe9df;
  --border: #d8d1c3;
  --text: #262320;
  --text-dim: #6b6355;
  --accent: #a8703a;
  --danger: #b8352b;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 12px 80px;
}

.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.topbar h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.2px;
  margin: 0;
  color: var(--accent);
  flex: 1 1 auto;
}

.search {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 16px;
  min-width: 160px;
  flex: 1 1 200px;
}

.legend {
  margin-bottom: 14px;
}
.legend-toggle-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.legend-toggle {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 15px;
  cursor: pointer;
  padding: 4px 0;
}
.legend-edit-toggle {
  background: var(--bg-panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  font-size: 12px;
  padding: 3px 8px;
  cursor: pointer;
}
.legend-body {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 15px;
  color: var(--text-dim);
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 4px;
}
.legend-dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-right: 6px;
  border: 1px solid rgba(0, 0, 0, 0.15);
}
.legend-row {
  display: flex;
  align-items: center;
}
.legend-icon {
  margin-right: 6px;
}
.legend-row-edit {
  gap: 6px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 6px;
}
.legend-color-input {
  width: 26px;
  height: 26px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: none;
  cursor: pointer;
}
.legend-color-clear {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 4px;
  width: 22px;
  height: 22px;
  font-size: 12px;
  cursor: pointer;
}
.legend-icon-input {
  width: 44px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 4px 6px;
  font-size: 14px;
  text-align: center;
}
.legend-label-input {
  flex: 1;
  min-width: 100px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 4px 6px;
  font-size: 14px;
}
.band-num-input {
  width: 56px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 4px 6px;
  font-size: 14px;
}
.band-sep {
  color: var(--text-dim);
}

.groups-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.group {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 12px;
  background: var(--bg-panel-2);
}

.collapse-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 17px;
  cursor: pointer;
  padding: 2px 4px;
}

.group-name {
  font-weight: 700;
  font-size: 18px;
  flex: 1;
  cursor: text;
}
.group-name-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--accent);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 7px;
  font-weight: 700;
  font-size: 18px;
}

.group-count {
  color: var(--text-dim);
  font-size: 13px;
  background: var(--bg);
  border-radius: 10px;
  padding: 1px 7px;
}

.group-type {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 6px;
  font-size: 13px;
  padding: 4px 6px;
}

.group-body {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.subgroup {
  border: 1px dashed var(--border);
  border-radius: 8px;
  padding: 8px;
}

.subgroup-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}

.subgroup-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-dim);
  flex: 1;
  cursor: text;
}
.subgroup-name-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--accent);
  color: var(--text);
  border-radius: 6px;
  padding: 4px 7px;
  font-size: 15px;
}

.subgroup-items {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.subgroup-items.drop-target {
  outline: 2px dashed var(--accent);
  outline-offset: 3px;
  border-radius: 8px;
}
.subgroup-empty-drop {
  font-size: 12px;
  color: var(--text-dim);
  border: 1px dashed var(--border);
  border-radius: 6px;
  padding: 10px;
  text-align: center;
}

.horsecard {
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: 7px solid var(--border);
  border-radius: 6px;
  transition: transform 0.08s ease;
}
.horsecard.dragging {
  opacity: 0.6;
}

.horsecard-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 10px;
  cursor: pointer;
  font-size: 17px;
}

.horse-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1 1 auto;
  min-width: 0;
}

.horse-name {
  flex: 0 1 auto;
  min-width: 40px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
}

.horse-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

.horse-sdg {
  font-variant-numeric: tabular-nums;
  font-size: 16px;
  font-weight: 700;
}

.horse-gender {
  font-size: 14px;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0 4px;
}

.horse-icon {
  font-size: 18px;
}

.badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 4px;
  letter-spacing: 0.3px;
}
.badge-sale {
  background: var(--danger);
  color: white;
}
.badge-ras {
  background: var(--bg-panel-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-weight: 600;
}
.horse-ras {
  color: var(--text-dim);
  font-size: 14px;
}
.badge-veiling {
  background: var(--accent);
  color: #1a1a1a;
}
.badge-gedekt {
  background: #6b7a8f;
  color: white;
}
.badge-dracht {
  background: #8a6fae;
  color: white;
}

.chev {
  color: var(--text-dim);
  font-size: 13px;
}

.horsecard-edit {
  padding: 10px;
  border-top: 1px solid var(--border);
  background: var(--bg-panel);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.horsecard-edit label {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 14px;
  color: var(--text-dim);
}

.horsecard-edit input[type="text"],
.horsecard-edit input[type="number"],
.horsecard-edit select,
.horsecard-edit textarea {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 16px;
}

.ras-hint {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: -4px;
}

.edit-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.edit-row .narrow {
  flex: 1 1 90px;
}
.edit-row.checks {
  flex-direction: row;
  align-items: center;
}
.chk {
  flex-direction: row !important;
  align-items: center;
  gap: 5px !important;
  font-size: 14px;
}
.chk input { width: auto; }

.edit-actions {
  display: flex;
  justify-content: flex-end;
}

.noterow {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 6px;
}
.noterow.dragging { opacity: 0.6; }
.noterow input {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-size: 16px;
  padding: 6px;
}
.noterow input:focus { outline: none; }

.draghandle {
  color: var(--text-dim);
  cursor: grab;
  padding: 4px 6px;
  font-size: 16px;
  line-height: 1;
  user-select: none;
}

.iconbtn {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 15px;
  padding: 4px 6px;
  border-radius: 6px;
}
.iconbtn-danger {
  color: var(--danger);
}
.iconbtn-danger:hover {
  background: rgba(209, 72, 63, 0.15);
}

.addbtn {
  background: var(--bg-panel-2);
  border: 1px dashed var(--border);
  color: var(--text-dim);
  border-radius: 6px;
  padding: 9px 10px;
  font-size: 14px;
  cursor: pointer;
  text-align: left;
}
.addbtn-sub {
  align-self: flex-start;
}
.addbtn-group {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  margin-top: 14px;
}

.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  padding: 8px 12px;
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}
.footer button {
  background: var(--bg-panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 9px 14px;
  font-size: 15px;
  cursor: pointer;
}
.footer button.danger {
  color: var(--danger);
  border-color: var(--danger);
}

/* ---------- App shell / tabs ---------- */
.app-shell {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 0 20px;
}
.shell-topbar {
  padding: 16px 12px 4px;
}
.shell-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  margin: 0;
}
.shell-savebar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.shell-save-btn {
  background: var(--bg-panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 14px;
  cursor: pointer;
}
.shell-saved-note {
  color: #357a41;
  font-size: 13px;
  font-weight: 600;
}
.shell-horse-count {
  margin-left: auto;
  color: var(--text-dim);
  font-size: 13px;
}
.shell-bottom-bar {
  display: flex;
  justify-content: center;
  padding: 20px 12px 30px;
}
.shell-bottom-bar button {
  background: var(--bg-panel-2);
  border: 1px solid var(--border);
  color: var(--danger);
  border-color: var(--danger);
  border-radius: 6px;
  padding: 8px 14px;
  font-size: 13px;
  cursor: pointer;
}
.tabbar {
  display: flex;
  gap: 4px;
  padding: 8px 12px 0;
  border-bottom: 1px solid var(--border);
}
.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  font-size: 15px;
  font-weight: 600;
  padding: 10px 14px;
  cursor: pointer;
}
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.app {
  padding: 16px 12px 24px;
  max-width: none;
}

/* ---------- Stamboom tab ---------- */
.stamboom {
  padding: 16px 12px 24px;
}
.stam-columns {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.stam-browse {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.stam-horse-list {
  max-height: 260px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-panel);
  display: flex;
  flex-direction: column;
}
.stam-horse-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  text-align: left;
  padding: 9px 10px;
  font-size: 15px;
  color: var(--text);
  cursor: pointer;
}
.stam-stal-tag {
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 400;
}
.stam-horse-item:last-child { border-bottom: none; }
.stam-horse-item.active {
  background: var(--bg-panel-2);
  font-weight: 700;
}
.add-external-form {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  background: var(--bg-panel);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.add-external-form label,
.horse-detail-editor label {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 12px;
  color: var(--text-dim);
}
.add-external-form input,
.add-external-form select,
.horse-detail-editor input,
.horse-detail-editor select,
.horse-detail-editor textarea {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 15px;
}
.stam-detail {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-panel);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.horse-detail-editor {
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 10px;
}
.stam-tree-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 700;
  font-size: 15px;
}
.stam-depth {
  display: flex !important;
  flex-direction: row !important;
  align-items: center;
  gap: 6px;
  font-size: 12px !important;
  color: var(--text-dim);
}
.stam-depth select {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 3px 6px;
}
.anc-tree {
  overflow-x: auto;
}
.anc-node {
  padding: 4px 0;
}
.anc-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
}
.anc-name {
  font-weight: 600;
}
.anc-tag {
  font-size: 11px;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0 5px;
}
.anc-extern {
  background: var(--bg-panel-2);
}
.anc-unknown-tag {
  font-style: italic;
}
.anc-unknown {
  color: var(--text-dim);
  font-style: italic;
  font-size: 13px;
  padding: 4px 0;
}
.anc-children {
  border-left: 1px dashed var(--border);
  margin-left: 6px;
}

.coi-tool {
  margin-top: 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-panel);
  padding: 12px;
}
.coi-result {
  margin-top: 10px;
  border: 1px solid;
  border-radius: 8px;
  padding: 10px 12px;
}
.coi-pct {
  font-size: 22px;
  font-weight: 800;
  margin-right: 8px;
}
.coi-label {
  font-weight: 700;
}
.coi-shared {
  margin: 8px 0 0;
  padding-left: 18px;
  font-size: 13px;
  color: var(--text-dim);
}

@media (min-width: 640px) {
  .stam-columns {
    flex-direction: row;
    align-items: flex-start;
  }
  .stam-browse {
    flex: 0 0 260px;
  }
  .stam-detail {
    flex: 1;
  }
}

</style>
</head>
<body>
<div id="root"></div>
